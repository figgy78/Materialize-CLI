<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Materialize</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%235cc8ff%27/%3E%3Cpath d=%27M3 11.5V4.5h2l3 4 3-4h2v7h-2V8l-3 4-3-4v3.5z%27 fill=%27%2306202c%27/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0e1013;        --panel: #161a20;   --panel-2: #1d222a;
    --line: #2a313b;      --text: #e7ecf3;    --muted: #94a1b2;
    --accent: #5cc8ff;    --accent-ink: #06202c;
    --ok: #4ade80;        --err: #ff7a7a;
    --radius: 12px;
  }
  :root[data-theme="light"] {
    --bg: #f4f6f9;        --panel: #ffffff;   --panel-2: #eef1f6;
    --line: #dde3ec;      --text: #16202c;    --muted: #5d6b7d;
    --accent: #0b84c4;    --accent-ink: #ffffff;
    --ok: #15803d;        --err: #c02626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 16px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; font-weight: 650; }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .spacer { flex: 1; }
  .chip {
    font: 500 12px/1 ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--muted); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 11px;
  }
  .layout { display: grid; grid-template-columns: 310px 1fr; gap: 18px; padding: 18px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  aside { padding: 16px; position: sticky; top: 18px; }
  aside h2, .stage h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  #drop {
    border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 26px 14px;
    text-align: center; cursor: pointer; transition: .15s; background: var(--panel-2);
  }
  #drop:hover, #drop.hot { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--panel-2)); }
  #drop strong { display: block; font-size: 14px; margin-bottom: 3px; }
  #drop span { font-size: 12.5px; color: var(--muted); }
  #thumb { width: 100%; border-radius: 8px; margin-top: 12px; display: none; border: 1px solid var(--line); }
  .field { margin-top: 16px; }
  .field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
  select, input[type=range] { width: 100%; }
  select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; font-size: 14px;
  }
  input[type=range] { accent-color: var(--accent); }
  button {
    font: 600 14px/1 inherit; border-radius: 9px; cursor: pointer; border: 1px solid transparent;
    padding: 11px 14px; transition: .15s;
  }
  .primary { width: 100%; margin-top: 18px; background: var(--accent); color: var(--accent-ink); }
  .primary:disabled { opacity: .45; cursor: not-allowed; }
  .ghost { background: var(--panel-2); color: var(--text); border-color: var(--line); padding: 8px 12px; font-size: 13px; }
  .ghost:hover { border-color: var(--accent); }
  .ghost.accent { border-color: var(--accent); color: var(--accent); }
  .ghost.accent:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .card.packed img { background: repeating-conic-gradient(#2a2a2a 0% 25%, #1c1c1c 0% 50%) 50%/14px 14px; }
  #lbChannels { display: flex; gap: 6px; }
  #lbChannels button { padding: 6px 11px; font-size: 12px; background: rgba(255,255,255,.12);
    color: #fff; border: 1px solid rgba(255,255,255,.2); }
  #lbChannels button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink);
    border-color: var(--accent); }

  #log {
    margin-top: 14px; font: 12px/1.55 ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--muted); white-space: pre-wrap; word-break: break-word; max-height: 190px; overflow: auto;
  }
  #log .bad { color: var(--err); }
  #log .good { color: var(--ok); }
  .stage { padding: 16px; min-height: 420px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tab { background: none; border: 1px solid transparent; color: var(--muted); padding: 7px 13px; font-size: 13.5px; }
  .tab[aria-selected="true"] { background: var(--panel-2); border-color: var(--line); color: var(--text); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
  .card { margin: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel-2); cursor: zoom-in; }
  .card img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: #000; image-rendering: pixelated; }
  .card figcaption { display: flex; justify-content: space-between; gap: 8px; padding: 9px 11px; font-size: 12.5px; }
  .card b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card em { font-style: normal; color: var(--muted); font-size: 11.5px; white-space: nowrap; flex: none; }
  .empty { color: var(--muted); text-align: center; padding: 70px 20px; font-size: 14px; }
  #fmtWarn:not(:empty) { margin-top: 8px; font-size: 12px; line-height: 1.45; color: var(--muted); }
  #view3d { display: none; }
  #view3d.on { display: grid; grid-template-columns: 1fr 210px; gap: 14px; }
  #canvasWrap { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #0b0d10; min-height: 430px; position: relative; }
  #canvasWrap canvas { display: block; width: 100%; height: 100%; }
  #three-msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13.5px; text-align: center; padding: 20px; }
  .ctrl { margin-bottom: 15px; }
  .ctrl label { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }
  .ctrl label span { color: var(--text); font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; }
  dialog#lightbox { border: none; background: transparent; padding: 0; max-width: 94vw; max-height: 94vh; }
  dialog#lightbox[open] { display: flex; flex-direction: column; align-items: center; }
  /* `display: block` below would otherwise beat the hidden attribute. */
  dialog#lightbox [hidden] { display: none; }
  dialog#lightbox::backdrop { background: rgba(0,0,0,.82); backdrop-filter: blur(3px); }
  #lightbox img, #lbCanvas { width: min(70vmin, 88vw); height: auto; max-height: 76vh;
    object-fit: contain; border-radius: 10px; display: block; image-rendering: pixelated; }
  #lbBar { display: flex; align-items: center; gap: 12px; justify-content: space-between;
    padding: 12px 2px 0; color: #fff; width: min(70vmin, 88vw); flex-wrap: wrap; }
  #lbBar b { text-transform: capitalize; }
  @media (max-width: 880px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: static; }
    #view3d.on { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <div class="dot" id="health"></div>
  <h1>Materialize</h1>
  <span class="chip" id="ver">connecting…</span>
  <div class="spacer"></div>
  <button class="ghost" id="themeBtn">Theme</button>
  <button class="ghost" id="zipBtn" disabled>Download .zip</button>
  <button class="ghost accent" id="unityBtn" disabled>Export for Unity</button>
</header>

<div class="layout">
  <aside class="panel">
    <h2>Source texture</h2>
    <div id="drop">
      <strong>Drop an image</strong>
      <span>or click to browse — png, jpg, tga, exr</span>
    </div>
    <img id="thumb" alt="Selected texture">
    <input type="file" id="file" accept=".png,.jpg,.jpeg,.tga,.exr,image/*" hidden>

    <div class="field">
      <label for="fmt">Output format</label>
      <select id="fmt">
        <option value="png">PNG — lossless</option>
        <option value="jpg">JPG — compressed</option>
        <option value="tga">TGA</option>
        <option value="exr">EXR — 32-bit float</option>
      </select>
      <div id="fmtWarn"></div>
    </div>

    <div class="field" id="qField" style="display:none">
      <label for="q">JPEG quality — <span id="qVal">95</span></label>
      <input type="range" id="q" min="0" max="100" value="95">
    </div>

    <button class="primary" id="go" disabled>Generate PBR maps</button>
    <div id="log">Pick a texture to begin.</div>
  </aside>

  <section class="panel stage">
    <div class="tabs">
      <button class="tab" id="tabMaps" aria-selected="true">Maps</button>
      <button class="tab" id="tab3d" aria-selected="false">3D preview</button>
    </div>

    <div id="viewMaps">
      <div class="grid" id="grid"></div>
      <div class="empty" id="emptyMsg">No maps yet — generate from a texture on the left.</div>
    </div>

    <div id="view3d">
      <div id="canvasWrap"><div id="three-msg">Generate maps to light them in 3D.</div></div>
      <div>
        <h2>Material</h2>
        <div class="ctrl">
          <label for="geo">Shape</label>
          <select id="geo">
            <option value="plane">Plane</option>
            <option value="sphere">Sphere</option>
            <option value="box">Cube</option>
          </select>
        </div>
        <div class="ctrl">
          <label for="disp">Displacement <span id="dispV">0.08</span></label>
          <input type="range" id="disp" min="0" max="0.4" step="0.01" value="0.08">
        </div>
        <div class="ctrl">
          <label for="nrm">Normal strength <span id="nrmV">1.0</span></label>
          <input type="range" id="nrm" min="0" max="3" step="0.05" value="1">
        </div>
        <div class="ctrl">
          <label for="lit">Light angle <span id="litV">35°</span></label>
          <input type="range" id="lit" min="0" max="360" value="35">
        </div>
        <div class="ctrl">
          <label for="tile">Tiling <span id="tileV">1×</span></label>
          <input type="range" id="tile" min="1" max="6" step="1" value="1">
        </div>
        <button class="ghost" id="spin" style="width:100%">Pause rotation</button>
      </div>
    </div>
  </section>
</div>

<dialog id="lightbox">
  <img id="lbImg" alt="">
  <canvas id="lbCanvas" hidden></canvas>
  <div id="lbBar">
    <b id="lbName"></b>
    <div id="lbChannels" hidden>
      <button data-ch="all" aria-pressed="true">All</button>
      <button data-ch="0">R</button>
      <button data-ch="1">G</button>
      <button data-ch="2">B</button>
      <button data-ch="3">A</button>
    </div>
    <a id="lbDl" class="ghost" style="text-decoration:none" download>Download</a>
  </div>
</dialog>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
const $ = (id) => document.getElementById(id);
const state = { file: null, result: null, three: null };

const LABELS = {
  height: "Height", normal: "Normal", metallic: "Metallic",
  smoothness: "Smoothness", edge: "Edge", ao: "AO",
  maskmap: "Mask Map", detail: "Detail Map",
};
// What each channel of the packed maps holds, per the HDRP docs.
const CHANNELS = {
  maskmap: ["Metallic", "Ambient Occlusion", "Detail Mask", "Smoothness"],
  detail: ["Desaturated albedo", "Normal Y", "Smoothness", "Normal X"],
};

/* ---------- theme ---------- */
$("themeBtn").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("mz-theme", next); } catch {}
};
try {
  const saved = localStorage.getItem("mz-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);
} catch {}

/* ---------- status ---------- */
fetch("/api/status").then(r => r.json()).then(s => {
  $("ver").textContent = s.version;
  $("ver").title = s.binary;
}).catch(() => {
  $("ver").textContent = "server unreachable";
  $("health").style.background = "var(--err)";
});

/* ---------- logging ---------- */
function log(msg, cls = "") {
  $("log").innerHTML = cls ? `<span class="${cls}">${msg}</span>` : msg;
}

/* ---------- file selection ---------- */
const drop = $("drop");
drop.onclick = () => $("file").click();
["dragenter", "dragover"].forEach(e =>
  drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add("hot"); }));
["dragleave", "drop"].forEach(e =>
  drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove("hot"); }));
drop.addEventListener("drop", ev => {
  if (ev.dataTransfer.files[0]) pick(ev.dataTransfer.files[0]);
});
$("file").onchange = ev => { if (ev.target.files[0]) pick(ev.target.files[0]); };

function pick(file) {
  state.file = file;
  $("go").disabled = false;
  const kb = (file.size / 1024).toFixed(0);
  log(`${file.name} — ${kb} KB\nReady to generate.`);
  // TGA/EXR won't render as a thumbnail; fail quietly to the dropzone text.
  const url = URL.createObjectURL(file);
  const img = $("thumb");
  img.onload = () => { img.style.display = "block"; };
  img.onerror = () => { img.style.display = "none"; };
  img.src = url;
}

/* ---------- options ---------- */
$("fmt").onchange = e => {
  const fmt = e.target.value;
  $("qField").style.display = fmt === "jpg" ? "block" : "none";
  // EXR is a 32-bit float container, but the maps feeding it are 8-bit, so
  // say so rather than implying extra precision.
  $("fmtWarn").textContent = fmt === "exr"
    ? "Written as 32-bit float RGB. The maps are generated at 8-bit, so values are exact but carry no extra precision."
    : "";
};
$("q").oninput = e => { $("qVal").textContent = e.target.value; };

/* ---------- generate ---------- */
$("go").onclick = async () => {
  if (!state.file) return;
  const fmt = $("fmt").value, q = $("q").value;
  $("go").disabled = true;
  log("Running materialize…");
  const params = new URLSearchParams({ name: state.file.name, format: fmt, quality: q });
  try {
    const res = await fetch(`/api/generate?${params}`, { method: "POST", body: state.file });
    const data = await res.json();
    if (!res.ok) {
      log(`${data.error}\n${data.stderr || ""}`, "bad");
      return;
    }
    state.result = data;
    render(data);
    let msg = `<span class="good">Generated ${data.maps.length} maps in ${data.seconds}s</span>`;
    if (data.note) msg += `\n${data.note}`;
    msg += `\n\n${data.stdout}`;
    log(msg);
    $("zipBtn").disabled = false;
    // JPEG cannot carry the packed maps, so there is nothing Unity-ready to ship.
    $("unityBtn").disabled = !data.maps.some(m => m.name === "maskmap");
  } catch (err) {
    log(`Request failed: ${err.message}`, "bad");
  } finally {
    $("go").disabled = false;
  }
};

$("zipBtn").onclick = () => {
  if (state.result) location.href = `/api/zip/${state.result.id}`;
};

/* ---------- 2D grid ---------- */
function render(data) {
  $("emptyMsg").style.display = "none";
  const grid = $("grid");
  grid.innerHTML = "";

  const cards = [{ name: "Diffuse", preview: data.original, file: "", bytes: 0, note: "source" }]
    .concat(data.maps.map(m => ({ ...m, key: m.name, name: LABELS[m.name] || m.name })));

  for (const m of cards) {
    const fig = document.createElement("figure");
    fig.className = CHANNELS[m.key] ? "card packed" : "card";
    const size = m.note || `${(m.bytes / 1024).toFixed(0)} KB`;
    fig.innerHTML = `
      <img src="${m.preview || ""}" alt="${m.name}" loading="lazy">
      <figcaption><b>${m.name}</b><em>${size}</em></figcaption>`;
    if (m.preview) {
      fig.onclick = () => openLightbox(m, data.stem);
    }
    grid.appendChild(fig);
  }
  if (state.three) state.three.apply(data);
}

let lbState = null;

function openLightbox(m, stem) {
  lbState = m;
  $("lbImg").src = m.preview;
  $("lbName").textContent = m.name;
  $("lbDl").href = m.preview;
  $("lbDl").setAttribute("download", m.file || stem);
  // Only the packed maps have channels worth pulling apart.
  const packed = !!CHANNELS[m.key];
  $("lbChannels").hidden = !packed;
  showChannel("all");
  $("lightbox").showModal();
}

function showChannel(ch) {
  for (const b of $("lbChannels").querySelectorAll("button")) {
    b.setAttribute("aria-pressed", String(b.dataset.ch === ch));
  }
  const img = $("lbImg"), canvas = $("lbCanvas");
  if (ch === "all") {
    img.hidden = false;
    canvas.hidden = true;
    $("lbName").textContent = lbState.name;
    return;
  }
  const idx = Number(ch);
  const src = new Image();
  src.onload = () => {
    canvas.width = src.width;
    canvas.height = src.height;
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(src, 0, 0);
    const d = ctx.getImageData(0, 0, canvas.width, canvas.height);
    // Paint the chosen channel as greyscale so it can be read on its own.
    for (let i = 0; i < d.data.length; i += 4) {
      const v = d.data[i + idx];
      d.data[i] = d.data[i + 1] = d.data[i + 2] = v;
      d.data[i + 3] = 255;
    }
    ctx.putImageData(d, 0, 0);
    img.hidden = true;
    canvas.hidden = false;
    const names = CHANNELS[lbState.key];
    $("lbName").textContent = `${lbState.name} — ${"RGBA"[idx]}: ${names[idx]}`;
  };
  src.src = lbState.preview;
}

for (const b of $("lbChannels").querySelectorAll("button")) {
  b.onclick = () => showChannel(b.dataset.ch);
}

$("lightbox").onclick = e => { if (e.target.id === "lightbox") $("lightbox").close(); };

$("unityBtn").onclick = () => {
  if (state.result) location.href = `/api/unity/${state.result.id}`;
};

/* ---------- tabs ---------- */
$("tabMaps").onclick = () => switchTab(true);
$("tab3d").onclick = () => switchTab(false);
function switchTab(maps) {
  $("tabMaps").setAttribute("aria-selected", maps);
  $("tab3d").setAttribute("aria-selected", !maps);
  $("viewMaps").style.display = maps ? "block" : "none";
  $("view3d").classList.toggle("on", !maps);
  if (!maps) initThree();
}

/* ---------- 3D preview ---------- */
let threeBooting = false;
async function initThree() {
  if (state.three || threeBooting) { if (state.three && state.result) state.three.apply(state.result); return; }
  threeBooting = true;
  try {
    const THREE = await import("three");
    const { OrbitControls } = await import("three/addons/controls/OrbitControls.js");
    state.three = buildScene(THREE, OrbitControls);
    $("three-msg").style.display = state.result ? "none" : "grid";
    if (state.result) state.three.apply(state.result);
  } catch (err) {
    $("three-msg").textContent =
      "The 3D preview needs three.js from unpkg.com — it couldn't load (offline?). The Maps tab works regardless.";
  } finally {
    threeBooting = false;
  }
}

function buildScene(THREE, OrbitControls) {
  const wrap = $("canvasWrap");
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(wrap.clientWidth, wrap.clientHeight);
  wrap.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0d10);
  const camera = new THREE.PerspectiveCamera(42, wrap.clientWidth / wrap.clientHeight, 0.1, 100);
  camera.position.set(0, 0.9, 2.3);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.autoRotateSpeed = 1.4;

  // The AO and roughness maps eat a lot of light; bias bright so the preview
  // reads close to the source texture.
  const key = new THREE.DirectionalLight(0xffffff, 3.1);
  const fill = new THREE.DirectionalLight(0x90b4ff, 0.7);
  fill.position.set(-2, 1, -1.5);
  scene.add(key, fill, new THREE.AmbientLight(0xffffff, 0.45));

  const material = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.75, metalness: 0.0 });
  let mesh = null, spinning = true;

  function geometryFor(kind) {
    if (kind === "sphere") return new THREE.SphereGeometry(0.85, 160, 160);
    if (kind === "box") return new THREE.BoxGeometry(1.3, 1.3, 1.3, 120, 120, 120);
    return new THREE.PlaneGeometry(1.8, 1.8, 220, 220);
  }

  function setGeometry(kind) {
    if (mesh) { scene.remove(mesh); mesh.geometry.dispose(); }
    const flat = kind === "plane";
    camera.position.set(0, flat ? 0 : 0.9, flat ? 2.4 : 2.3);
    controls.autoRotate = spinning && !flat;
    const geo = geometryFor(kind);
    // aoMap samples the second UV set; reuse the first.
    if (geo.attributes.uv && !geo.attributes.uv1) geo.setAttribute("uv1", geo.attributes.uv);
    mesh = new THREE.Mesh(geo, material);
    scene.add(mesh);
  }
  setGeometry("plane");

  const loader = new THREE.TextureLoader();
  function load(url, srgb) {
    return new Promise(resolve => {
      if (!url) return resolve(null);
      loader.load(url, tex => {
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        if (srgb) tex.colorSpace = THREE.SRGBColorSpace;
        resolve(tex);
      }, undefined, () => resolve(null));
    });
  }

  // Smoothness is the inverse of roughness, so flip it before use.
  function invert(url) {
    return new Promise(resolve => {
      if (!url) return resolve(null);
      const img = new Image();
      img.onload = () => {
        const c = document.createElement("canvas");
        c.width = img.width; c.height = img.height;
        const ctx = c.getContext("2d");
        ctx.drawImage(img, 0, 0);
        const d = ctx.getImageData(0, 0, c.width, c.height);
        for (let i = 0; i < d.data.length; i += 4) {
          d.data[i] = 255 - d.data[i];
          d.data[i + 1] = 255 - d.data[i + 1];
          d.data[i + 2] = 255 - d.data[i + 2];
        }
        ctx.putImageData(d, 0, 0);
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        resolve(tex);
      };
      img.onerror = () => resolve(null);
      img.src = url;
    });
  }

  let textures = [];
  async function apply(data) {
    $("three-msg").style.display = "none";
    const by = Object.fromEntries(data.maps.map(m => [m.name, m.preview]));
    const [diffuse, normal, metal, ao, height, rough] = await Promise.all([
      load(data.original, true), load(by.normal), load(by.metallic),
      load(by.ao), load(by.height), invert(by.smoothness),
    ]);
    textures.forEach(t => t && t.dispose());
    textures = [diffuse, normal, metal, ao, height, rough];

    material.map = diffuse;
    material.normalMap = normal;
    material.metalnessMap = metal;
    material.roughnessMap = rough;
    material.aoMap = ao;
    material.displacementMap = height;
    material.metalness = metal ? 1.0 : 0.0;
    material.roughness = rough ? 1.0 : 0.75;
    material.aoMapIntensity = 1.0;
    material.displacementScale = parseFloat($("disp").value);
    material.normalScale.set(parseFloat($("nrm").value), parseFloat($("nrm").value));
    material.needsUpdate = true;
    setTiling(parseInt($("tile").value, 10));
  }

  function setTiling(n) {
    textures.forEach(t => { if (t) { t.repeat.set(n, n); t.needsUpdate = true; } });
  }

  $("geo").onchange = e => setGeometry(e.target.value);
  $("geo").dispatchEvent(new Event("change"));
  $("disp").oninput = e => {
    material.displacementScale = parseFloat(e.target.value);
    $("dispV").textContent = e.target.value;
  };
  $("nrm").oninput = e => {
    material.normalScale.set(parseFloat(e.target.value), parseFloat(e.target.value));
    $("nrmV").textContent = parseFloat(e.target.value).toFixed(2);
  };
  $("lit").oninput = e => { $("litV").textContent = `${e.target.value}°`; };
  $("tile").oninput = e => {
    setTiling(parseInt(e.target.value, 10));
    $("tileV").textContent = `${e.target.value}×`;
  };
  $("spin").onclick = () => {
    spinning = !spinning;
    controls.autoRotate = spinning && $("geo").value !== "plane";
    $("spin").textContent = spinning ? "Pause rotation" : "Resume rotation";
  };

  new ResizeObserver(() => {
    const w = wrap.clientWidth, h = wrap.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }).observe(wrap);

  renderer.setAnimationLoop(() => {
    const a = parseFloat($("lit").value) * Math.PI / 180;
    key.position.set(Math.cos(a) * 3, 2.2, Math.sin(a) * 3);
    controls.update();
    renderer.render(scene, camera);
  });

  return { apply };
}
</script>
</body>
</html>
